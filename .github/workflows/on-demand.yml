name: On demand

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Which level to run
        type: choice
        default: smoke
        options: [all, smoke, regression, e2e, negative]
      environment:
        description: Which environment to run against
        type: choice
        default: production
        options: [production, staging]
      workers:
        description: Number of workers (the Free plan caps this at 2)
        type: choice
        default: '1'
        options: ['1', '2']

permissions:
  contents: read

concurrency:
  group: todoist-account-scheduled
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/_run-suite.yml
    with:
      suite: ${{ inputs.suite }}
      environment: ${{ inputs.environment }}
      workers: ${{ inputs.workers }}
      retention-days: '14'
    secrets: inherit
